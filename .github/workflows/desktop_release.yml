name: File4Base Multiplatform Desktop CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      no_latest:
        description: 'Do not move the Docker Hub latest tag (for hotfixes to older releases)'
        required: false
        default: false
        type: boolean

jobs:
  test-server:
    name: Test Go Server (vet + unit/integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: file4base
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: file4base_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U file4base -d file4base_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Run Go tests
        working-directory: server
        # Packages share one PostgreSQL instance, so they run one at a time
        run: go test -p 1 -count=1 ./...

