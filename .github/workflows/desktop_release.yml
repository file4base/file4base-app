name: File4Base Multiplatform Desktop CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-server:
    name: Test Go Server (vet + unit/integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: file4base
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: file4base_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U file4base -d file4base_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Run Go tests
        working-directory: server
        # Packages share one PostgreSQL instance, so they run one at a time
        run: go test -p 1 -count=1 ./...

  test-server-mariadb:
    name: Test Go Server (MariaDB engine)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11-jammy
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: file4base_dev
          MARIADB_USER: file4base
          MARIADB_PASSWORD: dev_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # The API creates one database per solution, as deploy/mariadb/init.sql
      # does for the Compose stack.
      - name: Grant server-level privileges to the API account
        run: |
          mariadb -h 127.0.0.1 -uroot -proot_password \
            -e "GRANT ALL PRIVILEGES ON *.* TO 'file4base'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Run the same Go tests against MariaDB
        working-directory: server
        env:
          F4B_TEST_ENGINE: mariadb
          F4B_TEST_ADMIN_DSN: "file4base:dev_password@tcp(127.0.0.1:3306)/mysql"
          F4B_TEST_DEV_DSN: "file4base:dev_password@tcp(127.0.0.1:3306)/file4base_dev"
        run: go test -p 1 -count=1 ./...

  build-macos:
    name: Build macOS Desktop (Universal / Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: client
        run: flutter test

      - name: Build macOS Release
        working-directory: client
        run: flutter build macos --release

      - name: Package macOS App
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent client/build/macos/Build/Products/Release/File4Base.app dist/File4Base-macOS.zip
          hdiutil create -volname "File4Base" -srcfolder client/build/macos/Build/Products/Release/File4Base.app -ov -format UDZO dist/File4Base-macOS.dmg

      - name: Upload macOS Zip Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/File4Base-macOS.zip
          archive: false

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/File4Base-macOS.dmg
          archive: false

  build-linux:
    name: Build Linux Desktop (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Linux Release
        working-directory: client
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          mkdir -p dist
          tar -czf dist/File4Base-Linux-x64.tar.gz -C client/build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/File4Base-Linux-x64.tar.gz
          archive: false

  build-windows:
    name: Build Windows Desktop (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Windows Release
        working-directory: client
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "client/build/windows/x64/runner/Release/*" -DestinationPath "dist/File4Base-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/File4Base-Windows-x64.zip
          archive: false

  publish-release:
    name: Publish GitHub Release
    needs: [test-server, test-server-mariadb, build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          skip-decompress: true
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --title "File4Base ${{ github.ref_name }}" \
            --generate-notes
