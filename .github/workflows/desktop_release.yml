name: File4Base Multiplatform Desktop CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Desktop (Universal / Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: client
        run: flutter test

      - name: Build macOS Release
        working-directory: client
        run: flutter build macos --release

      - name: Package macOS App
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent client/build/macos/Build/Products/Release/File4Base.app dist/File4Base-macOS.zip
          hdiutil create -volname "File4Base" -srcfolder client/build/macos/Build/Products/Release/File4Base.app -ov -format UDZO dist/File4Base-macOS.dmg

      - name: Upload macOS Zip Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/File4Base-macOS.zip
          archive: false

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/File4Base-macOS.dmg
          archive: false

  build-linux:
    name: Build Linux Desktop (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Linux Release
        working-directory: client
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          mkdir -p dist
          tar -czf dist/File4Base-Linux-x64.tar.gz -C client/build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/File4Base-Linux-x64.tar.gz
          archive: false

  build-windows:
    name: Build Windows Desktop (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Windows Release
        working-directory: client
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "client/build/windows/x64/runner/Release/*" -DestinationPath "dist/File4Base-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/File4Base-Windows-x64.zip
          archive: false

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          skip-decompress: true
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --title "File4Base ${{ github.ref_name }}" \
            --generate-notes
