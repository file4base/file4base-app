name: Code Quality
on:
  workflow_dispatch:
    inputs:
      auto_fix:
        description: 'Apply automated Dart/Flutter fixes (dart fix --apply) and commit back to branch'
        required: false
        default: false
        type: boolean
      run_qodana:
        description: 'Run the Qodana Cloud scan (needs a valid QODANA_TOKEN license)'
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  qodana-go:
    name: Go Vet Static Analysis (Qodana scan disabled)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Go Vet Static Analysis
        working-directory: server
        run: go vet ./...

      # Disabled by default: the Qodana Cloud license token is rejected
      # ("token was declined by Qodana Cloud server"), which failed every pull
      # request. Re-enable by running this workflow manually with run_qodana
      # once a valid QODANA_TOKEN is configured.
      - name: Qodana Go Scan
        if: ${{ inputs.run_qodana }}
        uses: JetBrains/qodana-action@v2024.3
        with:
          args: --project-dir=server
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

  flutter-analyze:
    name: Flutter Static Analysis (very_good_analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.Ref || github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Preview automated fixes (dart fix --dry-run)
        if: ${{ !inputs.auto_fix }}
        run: dart fix --dry-run

      - name: Apply automated fixes (dart fix --apply)
        if: ${{ inputs.auto_fix }}
        run: |
          dart fix --apply
          dart format .

      - name: Commit applied fixes
        if: ${{ inputs.auto_fix }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet client/; then
            git add client/
            git commit -m "style(client): apply very_good_analysis automated fixes"
            git push
          fi

      - name: Run Flutter Analyze (very_good_analysis)
        run: flutter analyze --no-fatal-infos


