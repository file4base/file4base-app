<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="538" rx="15" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <rect x="32" y="24" width="1136" height="56" rx="10" fill="#1E2430" stroke="#334155"/>
  <circle cx="62" cy="52" r="12" fill="url(#accentGrad)"/>
  <text x="86" y="58" fill="#F8FAFC" font-size="20" font-weight="700">File4Base — Assisted FileMaker Migration Pipeline (DDR + .fmp12 Case Study)</text>
  <text x="1144" y="57" fill="#38BDF8" font-size="13" font-weight="600" text-anchor="end">v0.12.0</text>

  <!-- Stage 1: Source Inputs -->
  <g transform="translate(32, 104)">
    <rect width="320" height="404" rx="12" fill="#1E2430" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="320" height="42" rx="12" fill="#0C4A6E"/>
    <text x="20" y="27" fill="#E0F2FE" font-size="15" font-weight="700">1. Source Artifacts (FileMaker)</text>

    <!-- Card A: DDR -->
    <rect x="20" y="62" width="280" height="148" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="88" fill="#38BDF8" font-size="14" font-weight="700">Design Report (XML or HTML DDR)</text>
    <text x="36" y="112" fill="#CBD5E1" font-size="12">• Base Tables &amp; 24 Columns</text>
    <text x="36" y="132" fill="#CBD5E1" font-size="12">• 4 Table Occurrences &amp; 3 Joins</text>
    <text x="36" y="152" fill="#CBD5E1" font-size="12">• 7 Layouts (768pt / 1024pt bounds)</text>
    <text x="36" y="172" fill="#CBD5E1" font-size="12">• Portals, Merge Text &amp; Group Buttons</text>
    <text x="36" y="192" fill="#CBD5E1" font-size="12">• Scripts &amp; 4 Value Lists</text>

    <!-- Card B: Binary .fmp12 / FMPXMLRESULT -->
    <rect x="20" y="228" width="280" height="156" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="254" fill="#38BDF8" font-size="14" font-weight="700">Data Source (.fmp12 / FMPXMLRESULT)</text>
    <text x="36" y="278" fill="#CBD5E1" font-size="12">• HBAM2 Page Scanner (recipes.fmp12)</text>
    <text x="36" y="298" fill="#CBD5E1" font-size="12">• 3 Recipes + 33 Ingredients + 8 Tags</text>
    <text x="36" y="318" fill="#CBD5E1" font-size="12">• Embedded JPEG/PNG Container Streams</text>
    <text x="36" y="338" fill="#CBD5E1" font-size="12">• Related UUID Foreign-Key Integrity</text>
    <text x="36" y="358" fill="#CBD5E1" font-size="12">• Computed Metric &amp; Summary Fields</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 358 306 L 408 306" stroke="#38BDF8" stroke-width="3" fill="none"/>
  <polygon points="408,300 420,306 408,312" fill="#38BDF8"/>

  <!-- Stage 2: Migration Engine -->
  <g transform="translate(424, 104)">
    <rect width="352" height="404" rx="12" fill="#1E2430" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="352" height="42" rx="12" fill="#0C4A6E"/>
    <text x="20" y="27" fill="#E0F2FE" font-size="15" font-weight="700">2. File4Base Migration Converter</text>

    <rect x="20" y="62" width="312" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="86" fill="#38BDF8" font-size="13" font-weight="700">Preflight &amp; Quarantine Engine</text>
    <text x="36" y="106" fill="#CBD5E1" font-size="11">• Dry-run ConversionReport (Preserved / Translated)</text>
    <text x="36" y="122" fill="#CBD5E1" font-size="11">• Quarantines triggers &amp; disables imported accounts</text>

    <rect x="20" y="146" width="312" height="84" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="170" fill="#38BDF8" font-size="13" font-weight="700">Relational &amp; Portal Disambiguation</text>
    <text x="36" y="190" fill="#CBD5E1" font-size="11">• Pair-key join index (layoutOcc | targetOcc)</text>
    <text x="36" y="206" fill="#CBD5E1" font-size="11">• Prevents self-joins from shadowing parent portals</text>
    <text x="36" y="222" fill="#CBD5E1" font-size="11">• Offsets portal child fields to absolute coordinates</text>

    <rect x="20" y="242" width="312" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="266" fill="#38BDF8" font-size="13" font-weight="700">Visual &amp; Merge Text Normalizer</text>
    <text x="36" y="286" fill="#CBD5E1" font-size="11">• Preserves &#x26;#13; line breaks &amp; {{LayoutName}} tokens</text>
    <text x="36" y="302" fill="#CBD5E1" font-size="11">• Binds Group Buttons directly to Photo / URL links</text>

    <rect x="20" y="326" width="312" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="350" fill="#38BDF8" font-size="13" font-weight="700">Script &amp; Calculation Translator</text>
    <text x="36" y="370" fill="#CBD5E1" font-size="11">• If / Set Variable ($$lastLayout) / Go to Layout</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 782 306 L 832 306" stroke="#38BDF8" stroke-width="3" fill="none"/>
  <polygon points="832,300 844,306 832,312" fill="#38BDF8"/>

  <!-- Stage 3: Target Solution -->
  <g transform="translate(848, 104)">
    <rect width="320" height="404" rx="12" fill="#1E2430" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="320" height="42" rx="12" fill="#0C4A6E"/>
    <text x="20" y="27" fill="#E0F2FE" font-size="15" font-weight="700">3. Live File4Base Solution</text>

    <rect x="20" y="62" width="280" height="74" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="86" fill="#4ADE80" font-size="13" font-weight="700">Edit Recipe (Form + 2 Portals)</text>
    <text x="36" y="106" fill="#CBD5E1" font-size="11">• US/imperial &amp; metric ingredient columns</text>
    <text x="36" y="122" fill="#CBD5E1" font-size="11">• Multiline instructions, tags portal &amp; Photo</text>

    <rect x="20" y="148" width="280" height="74" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="172" fill="#4ADE80" font-size="13" font-weight="700">View Recipe (Formatted Card)</text>
    <text x="36" y="192" fill="#CBD5E1" font-size="11">• Side-by-side Photo &amp; Description</text>
    <text x="36" y="208" fill="#CBD5E1" font-size="11">• Grouped ingredients &amp; clickable URL link</text>

    <rect x="20" y="234" width="280" height="74" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="258" fill="#4ADE80" font-size="13" font-weight="700">Recipe List (Repeating List View)</text>
    <text x="36" y="278" fill="#CBD5E1" font-size="11">• Header band + 49pt repeating record rows</text>
    <text x="36" y="294" fill="#CBD5E1" font-size="11">• Clickable Photo thumbnail -&gt; View Recipe</text>

    <rect x="20" y="320" width="280" height="68" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="36" y="344" fill="#4ADE80" font-size="13" font-weight="700">Web View (Embedded Web Viewer)</text>
    <text x="36" y="364" fill="#CBD5E1" font-size="11">• Dynamic URL bar + "back" via $$lastLayout</text>
  </g>
</svg>
