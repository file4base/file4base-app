server {
    listen 80;
    server_name localhost;
    client_max_body_size 64m;

    # Security Headers (Defense-in-Depth)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Reverse proxy API requests to backend Go container
    location ^~ /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Web-Container $hostname;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }

    # Reverse proxy Swagger UI and OpenAPI documentation (must precede static .js regex)
    location ~ ^/(swagger|docs|openapi\.json)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Web-Container $hostname;
    }

    # Reverse proxy health check endpoints (/healthz, /healthz/liveness, /healthz/readiness, etc.)
    location ~ ^/(healthz|livez|readyz|startupz)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Web-Container $hostname;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
    }

    # Prevent caching of entrypoint and service worker files
    location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Ensure Flutter JavaScript files are revalidated immediately
    location ~* \.js$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # Static Flutter Web files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
