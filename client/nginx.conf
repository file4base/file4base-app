# File4Base Web Client: HTTP listener.
#
# The HTTPS listener lives in nginx/tls.conf.template and is installed into
# conf.d at container start by docker-entrypoint.d/25-file4base-tls.sh, but
# only when the certificate the API persists is already readable. That keeps
# this container serving HTTP on a first start, before the API has created the
# File4Base Local CA.
# HSTS is announced over HTTPS only; see nginx/security-headers.conf.
map $scheme $file4base_hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 64m;

    include /etc/nginx/file4base/security-headers.conf;

    # Written by the entrypoint: a redirect to HTTPS when FILE4BASE_FORCE_HTTPS
    # is enabled and a certificate is available, empty otherwise.
    include /etc/nginx/file4base/force-https.conf;

    include /etc/nginx/file4base/app.conf;
}
