# Shared location blocks of the File4Base Web Client, included by both the
# HTTP (port 80) and the HTTPS (port 443) server blocks.

    # Reverse proxy API requests to backend Go container
    location ^~ /api/ {
        # The Web Client calls the API through here, so the upload routes get
        # the API's own limits (it enforces them too); every other request
        # keeps the server's 64m. The nested blocks inherit the headers below.
        location = /api/v1/solutions/import {
            client_max_body_size 256m;
            proxy_pass http://api:8080;
        }
        location = /api/v1/solutions/import-data {
            client_max_body_size 256m;
            proxy_pass http://api:8080;
        }
        location = /api/v1/server/backups/upload {
            client_max_body_size 512m;
            proxy_pass http://api:8080;
        }

        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Web-Container $hostname;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }

    # FileMaker migrations upload a native database copy of up to several
    # hundred megabytes and then import it, which takes minutes (#126). The
    # upload is streamed to the API instead of being buffered here; the size
    # and time limits match the API defaults (MIGRATION_MAX_UPLOAD_BYTES,
    # MIGRATION_REQUEST_TIMEOUT). Raise both together.
    location ^~ /api/v1/solutions/migrate/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Web-Container $hostname;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # FileMaker Data API (#208), served by the API as FileMaker Server
    # answers it, over this server's TLS. Not logged here: a sign-out names
    # its session token in the path (the API's own log redacts it).
    location ^~ /fmi/data {
        access_log off;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Web-Container $hostname;
        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Reverse proxy Swagger UI and OpenAPI documentation (must precede static .js regex)
    location ~ ^/(swagger|docs|openapi\.json)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Web-Container $hostname;
    }

    # Reverse proxy health check endpoints (/healthz, /healthz/liveness, /healthz/readiness, etc.)
    location ~ ^/(healthz|livez|readyz|startupz)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Web-Container $hostname;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
    }

    # Prevent caching of entrypoint and service worker files
    location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        root /usr/share/nginx/html;
        include /etc/nginx/file4base/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Ensure the Flutter bundle's code is revalidated immediately. The
    # JavaScript, the WebAssembly module and the ES module that loads it are
    # replaced together on every deploy, so one of them served from cache
    # beside a fresh one is a broken client.
    #
    # default_type names .mjs, which nginx's mime.types does not map: without
    # it the file is sent as application/octet-stream, and X-Content-Type-
    # Options: nosniff then makes the browser refuse to run it as a module.
    # .js and .wasm are in the map, so default_type never applies to them.
    location ~* \.(js|mjs|wasm)$ {
        root /usr/share/nginx/html;
        include /etc/nginx/file4base/security-headers.conf;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # Static Flutter Web files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
