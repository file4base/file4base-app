# Security headers of the File4Base Web Client (Defense-in-Depth).
#
# Nginx drops every inherited add_header in a context that sets one of its own,
# so this file is included both in the server blocks and in each location that
# adds headers, and the headers reach every response.
#
# $file4base_hsts is empty on plain HTTP (an add_header with an empty value is
# not sent), so HSTS is only ever announced over HTTPS.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security $file4base_hsts always;
