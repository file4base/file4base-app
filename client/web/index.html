<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="File4Base - Modern Open-Source Database & Rapid Application Development Engine">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="File4Base">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2"/>
  <link rel="shortcut icon" href="favicon.ico?v=2"/>

  <title>File4Base</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    New-version detector. The app is a PWA whose service worker caches the
    build, so after a deploy the browser keeps serving the old version until it
    is replaced. This watches for a newer service worker and, when one is ready,
    shows a bar offering to update (which unregisters the worker, clears the
    caches and reloads for a guaranteed-fresh version) or to cancel.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var shown = false;

      function forceUpdate() {
        var step = Promise.resolve();
        try {
          step = navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          });
        } catch (e) {}
        step.then(function () {
          return window.caches ? caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }) : null;
        }).catch(function () {}).then(function () {
          window.location.reload();
        });
      }

      function showBar() {
        if (shown) return;
        shown = true;
        var bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#1E88E5;color:#fff;font:14px -apple-system,Segoe UI,Roboto,sans-serif;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 -2px 10px rgba(0,0,0,.25)';
        var msg = document.createElement('span');
        msg.textContent = 'Hay una nueva versión de File4Base disponible.';
        msg.style.flex = '1';
        var reload = document.createElement('button');
        reload.textContent = 'Actualizar';
        reload.style.cssText = 'background:#fff;color:#1565C0;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer';
        reload.onclick = forceUpdate;
        var cancel = document.createElement('button');
        cancel.textContent = 'Cancelar';
        cancel.style.cssText = 'background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:8px 14px;cursor:pointer';
        cancel.onclick = function () { bar.remove(); shown = false; };
        bar.appendChild(msg); bar.appendChild(reload); bar.appendChild(cancel);
        document.body.appendChild(bar);
      }

      function watch(reg) {
        if (!reg) return;
        if (reg.waiting && navigator.serviceWorker.controller) showBar();
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) showBar();
          });
        });
        setInterval(function () { reg.update().catch(function () {}); }, 60000);
      }

      navigator.serviceWorker.ready.then(watch).catch(function () {});
    })();
  </script>
</body>
</html>
