<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="File4Base - Modern Open-Source Database & Rapid Application Development Engine">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="File4Base">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2"/>
  <link rel="shortcut icon" href="favicon.ico?v=2"/>

  <title>File4Base</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    New-version detector. Modern Flutter ships a self-unregistering service
    worker (no caching worker), so version changes cannot be observed through
    the service-worker update lifecycle. Instead this records the version this
    page was loaded with and then polls the deployed version.json; when the
    deployed version differs, a newer build is live and it offers to update
    (clear caches, unregister any worker and hard-reload) or to cancel.
  -->
  <script>
    (function () {
      var baseline = null;
      var shown = false;

      function fetchVersion() {
        return fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) { return (j && j.version) ? String(j.version) : null; })
          .catch(function () { return null; });
      }

      function forceUpdate() {
        var step = Promise.resolve();
        try {
          if ('serviceWorker' in navigator) {
            step = navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            });
          }
        } catch (e) {}
        step.then(function () {
          return window.caches ? caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }) : null;
        }).catch(function () {}).then(function () {
          // Cache-busting navigation so the fresh index.html/main.dart.js load.
          window.location.replace(window.location.pathname + '?v=' + Date.now());
        });
      }

      function showBar(version) {
        if (shown) return;
        shown = true;
        var bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#1E88E5;color:#fff;font:14px -apple-system,Segoe UI,Roboto,sans-serif;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 -2px 10px rgba(0,0,0,.25)';
        var msg = document.createElement('span');
        msg.textContent = 'Hay una nueva versión de File4Base disponible (v' + version + ').';
        msg.style.flex = '1';
        var reload = document.createElement('button');
        reload.textContent = 'Actualizar';
        reload.style.cssText = 'background:#fff;color:#1565C0;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer';
        reload.onclick = forceUpdate;
        var cancel = document.createElement('button');
        cancel.textContent = 'Cancelar';
        cancel.style.cssText = 'background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:8px 14px;cursor:pointer';
        cancel.onclick = function () { bar.remove(); shown = false; };
        bar.appendChild(msg); bar.appendChild(reload); bar.appendChild(cancel);
        document.body.appendChild(bar);
      }

      function check() {
        fetchVersion().then(function (v) {
          if (!v) return;
          if (baseline === null) { baseline = v; return; } // this build's version
          if (v !== baseline) showBar(v);
        });
      }

      check();                     // establish the baseline
      setInterval(check, 30000);   // then watch for a newer deployed version
    })();
  </script>
</body>
</html>
